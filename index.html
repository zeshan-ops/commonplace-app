  <!-- NOT black-translucent. That makes iOS treat the 59px status-bar strip as
       retractable chrome: the page canvas comes back as 793 of an 852 screen
       (lvh reports 852, clientHeight 793) positioned at y=0, leaving 59px of
       screen below the page that nothing can paint into, and only a user
       scroll retracts it. That was the root of the long-running bottom-nav
       bug — see the "bottom nav position bug" section in CLAUDE.md before
       changing this back. `default` gives the same 793px canvas but
       positioned at screen 59-852, so it fills the bottom properly. The
       status bar's own background follows the theme-color meta below, which
       the bootstrap script keeps in sync with the active theme. -->
